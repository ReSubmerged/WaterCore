name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install CMake
        run: sdkmanager "cmake;3.31.6"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        if: github.ref_type != 'tag'
        run: ./gradlew assembleDebug

      - name: Decode keystore
        if: github.ref_type == 'tag'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/keystore.jks

      - name: Build Release APK
        if: github.ref_type == 'tag'
        run: ./gradlew :mangoApp:copyReleaseApk
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEY_ALIAS: mangocore
          KEY_PASSWORD: ${{ secrets.MANGO_PASSWD }}
          KEYSTORE_PASSWORD: ${{ secrets.MANGO_PASSWD }}

      - name: Upload Debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: mangoApp-debug
          path: mangoApp/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: mangoApp-release-${{ github.ref_name }}
          path: build/mangoApp-release.apk

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          draft: true
          files: build/mangoApp-release.apk
